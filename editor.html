<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bit Builder — level editor</title>
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/editor.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">&#9998;</span>
    <div>
      <h1 data-i18n="ed.title">Level editor</h1>
      <p data-i18n="ed.tagline"></p>
    </div>
  </div>
  <div class="topbar-actions">
    <button id="btn-lang" class="btn" title="Language / 语言">中文</button>
    <a class="btn" href="index.html" data-i18n="ed.back">Back to the game</a>
  </div>
</header>

<main class="ed-shell">
  <section class="stage">
    <canvas id="ed-board" width="640" height="640"></canvas>
    <p class="ed-hint" data-i18n="ed.hint"></p>
  </section>

  <aside class="panel ed-panel">
    <div class="ed-fields">
      <label><span data-i18n="ed.name">Name</span> <input id="ed-name" type="text" maxlength="60" value="My level"></label>
      <label><span data-i18n="ed.seconds">Seconds</span> <input id="ed-time" type="number" min="10" max="3600" value="150"></label>
      <label><span data-i18n="ed.width">Width</span> <input id="ed-w" type="number" min="7" max="40" value="15"></label>
      <label><span data-i18n="ed.height">Height</span> <input id="ed-h" type="number" min="7" max="40" value="13"></label>
      <label class="wide"><span data-i18n="ed.hintLine">Hint shown at the help terminal</span>
        <input id="ed-hintline" type="text" maxlength="240" value="">
      </label>
    </div>

    <div class="belt">
      <h3 data-i18n="ed.brush">Brush</h3>
      <div id="ed-palette" class="ed-palette"></div>
    </div>

    <div class="belt">
      <h3 data-i18n="ed.parts">Parts on the map</h3>
      <div id="ed-kinds" class="ed-kinds"></div>
    </div>

    <div id="ed-report" class="ed-report"></div>

    <div class="ed-buttons">
      <button id="ed-check" class="btn btn-primary" data-i18n="ed.check">Check</button>
      <button id="ed-play" class="btn" data-i18n="ed.play">Test play</button>
      <button id="ed-copy" class="btn" data-i18n="ed.copy">Copy share link</button>
      <button id="ed-load" class="btn" data-i18n="ed.load">Load code</button>
      <button id="ed-start" class="btn" data-i18n="ed.start">Start from a level</button>
      <button id="ed-clear" class="btn" data-i18n="ed.clear">Clear</button>
    </div>
  </aside>
</main>

<footer class="foot">Every level is just text — a share link holds the whole map.</footer>

<script src="js/i18n.js"></script>
<script src="js/knowledge.js"></script>
<script src="js/levels.js"></script>
<script src="js/engine.js"></script>
<script src="js/sprites.js"></script>
<script src="js/validate.js"></script>
<script src="js/codec.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
